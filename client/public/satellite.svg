<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Earth / Orbit Arc -->
  <circle cx="32" cy="32" r="30" stroke="#1e2c44" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 12 50 A 26 26 0 0 0 52 50" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round" />
  <!-- Satellite Body -->
  <rect x="26" y="26" width="12" height="12" rx="2" fill="url(#grad1)" transform="rotate(45 32 32)" />
  <!-- Solar Panels Left -->
  <rect x="10" y="30" width="10" height="4" rx="1" fill="#38bdf8" />
  <rect x="10" y="24" width="10" height="4" rx="1" fill="#0284c7" />
  <line x1="20" y1="29" x2="24" y2="31" stroke="#94a3b8" stroke-width="1.5" />
  <!-- Solar Panels Right -->
  <rect x="44" y="30" width="10" height="4" rx="1" fill="#38bdf8" />
  <rect x="44" y="36" width="10" height="4" rx="1" fill="#0284c7" />
  <line x1="40" y1="33" x2="44" y2="35" stroke="#94a3b8" stroke-width="1.5" />
  <!-- Sensor Dish -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
  <path d="M 32 32 L 32 40" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
  <path d="M 28 42 A 5 5 0 0 0 36 42" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" />
</svg>
